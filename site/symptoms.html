<!doctype html>
<html lang="th" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>อาการร่วม — Cough Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Zm-7-3a1 1 0 1 0-2 0 9 9 0 0 0 8 8v3h2v-3a9 9 0 0 0 8-8 1 1 0 1 0-2 0 7 7 0 0 1-14 0Z" fill="currentColor"/></svg>
        </span>
        Cough Code
      </a>
      <div class="header-actions">
        <a class="header-back" href="record.html">← อัดเสียงใหม่</a>
        <div class="theme-switch" title="สลับโหมดสว่าง/มืด">
          <input type="checkbox" id="themeToggle" />
          <label for="themeToggle"><i class="thumb"></i></label>
        </div>
      </div>
    </div>
  </header>

  <nav class="stepper" aria-label="ขั้นตอนการประเมิน">
    <div class="step is-done"><span class="step-dot">✓</span><span class="step-label">อัดเสียงไอ</span></div>
    <div class="step-line is-done"></div>
    <div class="step is-active"><span class="step-dot">2</span><span class="step-label">อาการร่วม</span></div>
    <div class="step-line"></div>
    <div class="step"><span class="step-dot">3</span><span class="step-label">ผลลัพธ์</span></div>
  </nav>

  <main class="container-narrow sym-shell">
    <h1 class="center" style="font-size:var(--fs-xl)">อาการร่วม</h1>
    <p class="muted center">เลือกอาการที่คุณพบร่วมด้วย (เลือกได้หลายข้อ) เพื่อใช้ประกอบการวิเคราะห์เสียงไอ</p>

    <p id="msg" class="warn"></p>

    <form id="symForm">
      <div class="sym-groups">
        <div class="sym-group">
          <p class="sym-group-title"><span class="dot"></span>ระบบทางเดินหายใจส่วนบน</p>
          <div class="sym-grid">
            <label class="sym-item"><input type="checkbox" name="sym" value="คัดจมูก"><span>คัดจมูก</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="น้ำมูกไหล"><span>น้ำมูกไหล</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="เจ็บคอ"><span>เจ็บคอ</span></label>
          </div>
        </div>

        <div class="sym-group">
          <p class="sym-group-title"><span class="dot"></span>ไข้และอาการทั่วไป</p>
          <div class="sym-grid">
            <label class="sym-item"><input type="checkbox" name="sym" value="ไข้ต่ำ"><span>ไข้ต่ำ</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="ไข้สูง"><span>ไข้สูง</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="อ่อนเพลีย"><span>อ่อนเพลีย</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="ปวดศีรษะ"><span>ปวดศีรษะ</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="ปวดเมื่อยตามตัว"><span>ปวดเมื่อยตามตัว</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="เบื่ออาหาร"><span>เบื่ออาหาร</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="น้ำหนักลด"><span>น้ำหนักลด</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="เหงื่อออกตอนกลางคืน"><span>เหงื่อออกตอนกลางคืน</span></label>
          </div>
        </div>

        <div class="sym-group is-severe">
          <p class="sym-group-title"><span class="dot"></span>สัญญาณเตือนรุนแรง</p>
          <div class="sym-grid">
            <label class="sym-item"><input type="checkbox" name="sym" value="เจ็บหน้าอก"><span>เจ็บหน้าอก</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="หายใจลำบาก"><span>หายใจลำบาก</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="หายใจเร็ว"><span>หายใจเร็ว</span></label>
            <label class="sym-item"><input type="checkbox" name="sym" value="หายใจหอบเหนื่อย"><span>หายใจหอบเหนื่อย</span></label>
          </div>
        </div>
      </div>

      <div class="sym-actions">
        <button id="doneBtn" type="button" class="btn primary" disabled>เสร็จสิ้น ดูผลลัพธ์</button>
      </div>
    </form>
  </main>

  <footer class="site-footer"><div class="container center"><p class="muted small">เครื่องมือนี้เป็นการคัดกรองเบื้องต้น ไม่สามารถวินิจฉัยแทนแพทย์ได้</p></div></footer>

  <script src="theme.js" defer></script>
  <script>
  (() => {
    // === ชี้ API จริงของคุณ ===
    const API_URL = "http://127.0.0.1:8000/predict";

    const form = document.getElementById('symForm');
    const btn  = document.getElementById('doneBtn');
    const msg  = document.getElementById('msg');

    function update(){
      const any = [...form.querySelectorAll('input[name="sym"]:checked')].length > 0;
      btn.disabled = !any;
      msg.textContent = any ? '' : 'เลือกอาการอย่างน้อย 1 ข้อ';
    }
    form.addEventListener('change', update); update();

    function dataURLtoBlob(dataURL){
      const [head, b64] = dataURL.split(',');
      const mime = (head.match(/:(.*?);/)||[])[1] || 'application/octet-stream';
      const bin = atob(b64); const u8 = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      return new Blob([u8], {type:mime});
    }

    // Fallback คำนวณคะแนนจากอาการ ถ้าเรียก API ไม่สำเร็จ (สำหรับ 4 กลุ่ม: RSV / ไอกรน / ปอดบวม / อื่นๆ)
    function fallbackFromSymptoms(sym){
      let score = { "RSV":0.28, "ไอกรน":0.22, "ปอดบวม":0.28, "อื่นๆ":0.22 };
      const has = k => sym.includes(k);

      if (has("คัดจมูก"))          { score["RSV"] += 0.05; score["อื่นๆ"] += 0.03; }
      if (has("น้ำมูกไหล"))        { score["RSV"] += 0.05; score["อื่นๆ"] += 0.03; }
      if (has("เจ็บคอ"))           { score["RSV"] += 0.03; score["อื่นๆ"] += 0.03; }

      if (has("ไข้ต่ำ"))           { score["RSV"] += 0.02; score["อื่นๆ"] += 0.03; }
      if (has("ไข้สูง"))           { score["ปอดบวม"] += 0.06; score["ไอกรน"] += 0.02; }
      if (has("อ่อนเพลีย"))        { score["ไอกรน"] += 0.02; score["อื่นๆ"] += 0.02; }
      if (has("ปวดศีรษะ"))         { score["อื่นๆ"] += 0.02; }
      if (has("ปวดเมื่อยตามตัว"))   { score["ไอกรน"] += 0.02; score["อื่นๆ"] += 0.02; }

      if (has("เจ็บหน้าอก"))       { score["ปอดบวม"] += 0.07; }
      if (has("หายใจลำบาก"))       { score["ปอดบวม"] += 0.09; score["RSV"] += 0.03; }
      if (has("หายใจเร็ว"))        { score["ปอดบวม"] += 0.06; score["RSV"] += 0.02; }
      if (has("หายใจหอบเหนื่อย"))   { score["ปอดบวม"] += 0.08; score["RSV"] += 0.03; }

      if (has("เบื่ออาหาร"))       { score["ปอดบวม"] += 0.02; score["ไอกรน"] += 0.01; }
      if (has("น้ำหนักลด"))        { score["ปอดบวม"] += 0.02; score["ไอกรน"] += 0.02; }
      if (has("เหงื่อออกตอนกลางคืน")){ score["ปอดบวม"] += 0.03; score["ไอกรน"] += 0.02; }

      const sum = Object.values(score).reduce((a,b)=>a+b,0);
      Object.keys(score).forEach(k=>score[k]/=sum);
      return score;
    }

    btn.addEventListener('click', async ()=>{
      const dataURL = sessionStorage.getItem('audioDataURL');
      if(!dataURL){ alert('ไม่พบไฟล์เสียง กรุณาบันทึกใหม่'); location.href='./record.html'; return; }
      const audioBlob = dataURLtoBlob(dataURL);

      const symptoms = [...form.querySelectorAll('input[name="sym"]:checked')].map(el=>el.value);
      sessionStorage.setItem('symptoms', JSON.stringify(symptoms));

      btn.disabled = true; btn.textContent = 'กำลังส่งข้อมูล...';
      const fd = new FormData();
      fd.append('file', audioBlob, 'recording.webm');
      fd.append('symptoms', JSON.stringify(symptoms));

      try{
        const r = await fetch(API_URL, { method:'POST', body: fd });
        if(!r.ok) throw new Error(await r.text());
        const json = await r.json();
        sessionStorage.setItem('diagnosis', JSON.stringify(json));
        sessionStorage.removeItem('diag_fallback');
        location.href = './result.html';
      }catch(e){
        const fb = { conditions: fallbackFromSymptoms(symptoms), note:'fallback' };
        sessionStorage.setItem('diagnosis', JSON.stringify(fb));
        sessionStorage.setItem('diag_fallback','1');
        location.href = './result.html';
      }
    });
  })();
  </script>
</body>
</html>
